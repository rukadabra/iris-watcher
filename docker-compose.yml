# Dokploy: pasang domain ke service `web` pada port 3000.
# DATABASE_URL dan REDIS_URL mengarah ke Postgres dan Redis yang sudah ada.
# Bot tidak punya port publik. Jalankan satu replika: dua koneksi Gateway dengan token yang sama saling memutus sesi.

services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DEFAULT_PREFIX: ${DEFAULT_PREFIX:-!iris}
      HEALTH_PORT: 8080
      PLAYER_URL: ${PLAYER_URL:-}
      PLAYER_TOKEN: ${PLAYER_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      PLAYER_URL: ${PLAYER_URL:-}
      PLAYER_TOKEN: ${PLAYER_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DEFAULT_PREFIX: ${DEFAULT_PREFIX:-!iris}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  player:
    profiles: ["player"]
    build:
      context: .
      dockerfile: apps/player/Dockerfile
    restart: unless-stopped
    environment:
      PLAYER_TOKEN: ${PLAYER_TOKEN}
      PLAYER_HOST: 0.0.0.0
      PLAYER_PORT: 8090
    ports:
      - "127.0.0.1:8090:8090"
